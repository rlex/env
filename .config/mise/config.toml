[tools]
# --- Aqua repositories ---
"aqua:ahmetb/kubectx" = "latest"
"aqua:ahmetb/kubectx/kubens" = "latest"
"aqua:kubernetes/kubernetes/kubectl" = "latest"
"aqua:SonarSource/sonarqube-cli" = "latest"
# ---Github repositories ---
"github:anomalyco/opencode" = "latest"
"github:aquasecurity/tfsec" = "latest"
"github:aquasecurity/trivy" = "latest"
"github:betterleaks/betterleaks" = "latest"
"github:bitnami/sealed-secrets" = {
  version = "latest",
  matching = "kubeseal"
}
"github:burntsushi/ripgrep" = "latest"
"github:byron/dua-cli" = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:carapace-sh/carapace-bin" = "latest"
"github:charmbracelet/glow" = "latest"
"github:cilium/cilium-cli" = "latest"
"github:dandavison/delta" = "latest"
"github:databus23/helm-diff" = {
  version = "latest",
  bin = "diff",
  bin_path = "diff/bin",
  rename_exe = "helm-diff"
}
"github:derailed/k9s" = "latest"
"github:dicklesworthstone/destructive_command_guard" = "latest"
"github:docker/docker-language-server" = "latest"
"github:entireio/cli" = "latest"
"github:firecow/gitlab-ci-local" = "latest"
"github:gastownhall/beads" = "latest"
"github:getzola/zola" = "latest"
"github:google/osv-scanner" = "latest"
#"github:go-delve/delve" = "latest"
"github:helmfile/helmfile" = "latest"
"github:hmans/beans" = "latest"
"github:istio/istio" = {
  version = "latest",
  matching = "istioctl"
}
"github:jdx/pitchfork" = "latest"
"github:jesseduffield/lazygit" = "latest"
"github:junegunn/fzf" = "latest"
"github:jqlang/jq" = "latest"
"github:kenn-io/kata" = "latest"
"github:kenn-io/roborev" = "latest"
"github:koalaman/shellcheck" = "latest"
"github:kubernetes-sigs/krew" = "latest"
"github:kubie-org/kubie" = "latest"
"github:lance0/ttl" = "latest"
"github:mikefarah/yq" = "latest"
"github:modem-dev/hunk" = "latest"
"github:mvdan/sh" = {
  version = "latest",
  bin = "shfmt"
}
"github:natesales/q" = "latest"
"github:nektos/act" = "latest"
"github:neovim/neovim" = "latest"
"github:nolabs-ai/nono" = "latest"
"github:norwoodj/helm-docs" = "latest"
"github:ogulcancelik/herdr" = "latest"
"github:openai/codex" = {
  version = "latest",
  bin = "codex",
  platforms = {
    linux-x64 = { asset_pattern = "codex-x86_64-unknown-linux-musl.tar.gz" },
    linux-arm64 = { asset_pattern = "codex-aarch64-unknown-linux-musl.tar.gz" },
    macos-arm64 = { asset_pattern = "codex-aarch64-apple-darwin.tar.gz" }
  },
  matching = "codex-*.tar.gz"
}
"github:opentofu/opentofu" = "latest"
"github:orange-opensource/hurl" = "latest"
"github:orf/gping" = "latest"
"github:pre-commit/pre-commit" = {
  version = "latest",
  bin = "pre-commit"
}
"github:projectcalico/calico" = {
  version = "latest",
  matching = "calicoctl"
}
"github:quietpublish/mardi-gras" = "latest"
"github:rhysd/actionlint" = "latest"
"github:sharkdp/bat" = "latest"
"github:sharkdp/fd" = "latest"
"github:sinelaw/fresh" = "latest"
"github:starship/starship" = "latest"
"github:sxyazi/yazi" = "latest"
"github:tombi-toml/tombi" = "latest"
"github:trufflesecurity/trufflehog" = "latest"
"github:velero-io/velero" = "latest"
"github:vmware-tanzu/sonobuoy" = "latest"
"github:yannh/kubeconform" = "latest"
"github:yt-dlp/yt-dlp" = {
  version = "latest",
  bin = "yt-dlp"
}
# --- Krew repositories
"krew:access-matrix" = "latest"
"krew:gadget" = "latest"
"krew:tree" = "latest"
"krew:volsync" = "latest"
"krew:ctx" = "latest"
"krew:ns" = "latest"
# --- Builtin repositories ---
bun = "latest"
deno = "latest"
go = {
  version = "latest",
  set_gobin = "true",
  postinstall = """
    go install golang.org/x/tools/gopls@latest
  """
}
helm = "latest"
node = {
  version = "latest",
  postinstall = '''
    bun install -g gts typescript-language-server bashls
  '''
}
python = {
  version = "latest",
  postinstall = '''
    pip install ptpython yapf pylint mycli pgcli litecli basedpyright pipx black
  '''
}
ruby = {
  version= "latest",
  postinstall = '''
    gem install rubocop solargraph
  '''
}
rust = "latest"
uv = "latest"
usage = "latest"

[plugins]
krew = "https://github.com/soupglasses/mise-krew"

[settings]
minimum_release_age = "1d"
not_found_auto_install = false
experimental = true
trusted_config_paths = ["~/.rc/.config/mise"]

[settings.npm]
package_manager = "bun"

[settings.ruby]
compile = false
