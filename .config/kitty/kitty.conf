# thanks to https://github.com/hanndoddi/dotfiles/tree/main/.config/kitty for

# BEGIN_KITTY_FONTS
font_family      family='PragmataPro Mono' postscript_name=PragmataProMono-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
# END_KITTY_FONTS

# cmd+u to switch between transparent modes
dynamic_background_opacity yes
map cmd+u remote_control_script ~/.config/kitty/toggle-opacity

update_check_interval 0
confirm_os_window_close 0

listen_on unix:/tmp/kitty
allow_remote_control socket-only

# tabs with style
tab_bar_edge bottom
tab_bar_margin_height 5.0 5.0
tab_bar_style custom
tab_powerline_style round
active_tab_foreground #FFFFFF
inactive_tab_foreground #888888
active_tab_background #458588
tab_title_template "{index}: {title}"

# stubborn stuff
term xterm-256color

# iterm-style
map cmd+left previous_tab
map cmd+right next_tab

# theme definition
include theme.conf